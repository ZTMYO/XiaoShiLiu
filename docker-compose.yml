name: xiaoshiliu

# 真机部署：
#   1. 将根目录 .env.docker 复制为 .env，按服务器实际修改（DB密码、JWT、域名等）
#   2. 执行 docker compose up -d --build
# 业务配置只需维护根目录这一份 .env，各服务通过 env_file / 变量引用它。

services:
  # MySQL数据库服务
  mysql:
    # 使用官方MySQL镜像
    image: mysql:8.0
    container_name: xiaoshiliu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-xiaoshiliu}
      MYSQL_USER: ${DB_USER:-xiaoshiliu_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./express-project/scripts/init-database.sql:/docker-entrypoint-initdb.d/init.sql
      - /etc/localtime:/etc/localtime:ro
    networks:
      - xiaoshiliu-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 后端API服务
  backend:
    build:
      context: ./express-project
      dockerfile: Dockerfile
    container_name: xiaoshiliu-backend
    restart: unless-stopped
    environment:
      # 以下属于容器内网/运行模式等基础设施常量，不随业务环境变化
      NODE_ENV: production
      DB_HOST: mysql
      TZ: Asia/Shanghai
    # 其余业务配置（DB密码/JWT/上传/邮件/图床等）统一从根目录 .env 注入，
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/uploads
      - ./doc:/doc:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - xiaoshiliu-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端Web服务
  frontend:
    build:
      context: ./vue3-project
      dockerfile: Dockerfile
      args:
        # 前端默认走相对路径 /api 由 nginx 反代；仅当直连后端时才需要覆盖
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api}
    container_name: xiaoshiliu-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - xiaoshiliu-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  xiaoshiliu-network:
    driver: bridge